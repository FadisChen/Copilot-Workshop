<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日待辦</title>
  <style>
    :root {
      --ink: #1f2933;
      --muted: #6b7785;
      --paper: #fffdf8;
      --surface: #f7f4ec;
      --line: #e5e0d5;
      --accent: #e56b4e;
      --accent-dark: #c85239;
      --success: #47796b;
      --shadow: 0 22px 60px rgba(62, 53, 39, 0.12);
      --radius: 24px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #edf2f0;
        --muted: #aab8b4;
        --paper: #202c2b;
        --surface: #121918;
        --line: #3a4a47;
        --accent: #f18464;
        --accent-dark: #ff9a7d;
        --success: #77b3a1;
        --shadow: 0 22px 60px rgba(0, 0, 0, 0.3);
      }
    }

    [data-theme="light"] {
      --ink: #1f2933;
      --muted: #6b7785;
      --paper: #fffdf8;
      --surface: #f7f4ec;
      --line: #e5e0d5;
      --accent: #e56b4e;
      --accent-dark: #c85239;
      --success: #47796b;
      --shadow: 0 22px 60px rgba(62, 53, 39, 0.12);
    }

    [data-theme="dark"] {
      --ink: #edf2f0;
      --muted: #aab8b4;
      --paper: #202c2b;
      --surface: #121918;
      --line: #3a4a47;
      --accent: #f18464;
      --accent-dark: #ff9a7d;
      --success: #77b3a1;
      --shadow: 0 22px 60px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font-family: "Trebuchet MS", "Microsoft JhengHei", sans-serif;
      background:
        radial-gradient(circle at 12% 18%, rgba(229, 107, 78, 0.16) 0 3px, transparent 4px),
        radial-gradient(circle at 85% 82%, rgba(71, 121, 107, 0.16) 0 4px, transparent 5px),
        var(--surface);
      background-size: 30px 30px, 42px 42px, auto;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app-shell {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 32px 20px;
    }

    .todo-card {
      width: min(100%, 520px);
      padding: clamp(24px, 5vw, 42px);
      background: var(--paper);
      border: 1px solid rgba(229, 224, 213, 0.8);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      animation: card-in 500ms ease both;
    }

    .app-header,
    .app-footer,
    .list-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .theme-toggle {
      padding: 8px 10px;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .theme-toggle:hover,
    .theme-toggle:focus-visible {
      color: var(--ink);
      border-color: var(--accent);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 8vw, 3rem);
      font-weight: 700;
      letter-spacing: 0;
      line-height: 1;
    }

    .header-mark {
      display: grid;
      width: 48px;
      height: 48px;
      place-items: center;
      color: var(--paper);
      font-family: Georgia, serif;
      font-size: 1.8rem;
      background: var(--success);
      border-radius: 50%;
      transform: rotate(8deg);
    }

    .todo-form {
      display: flex;
      gap: 10px;
      margin: 32px 0 28px;
    }

    .todo-form input {
      min-width: 0;
      flex: 1;
      padding: 14px 16px;
      color: var(--ink);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      outline: none;
      transition: border-color 180ms ease, box-shadow 180ms ease;
    }

    .todo-form input::placeholder {
      color: #9ba3a8;
    }

    .todo-form input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(229, 107, 78, 0.14);
    }

    .todo-form button {
      padding: 0 20px;
      color: #fff;
      font-weight: 700;
      background: var(--accent);
      border-radius: 12px;
      transition: background 180ms ease, transform 180ms ease;
    }

    .todo-form button:hover {
      background: var(--accent-dark);
      transform: translateY(-1px);
    }

    .todo-form button:focus-visible,
    .theme-toggle:focus-visible,
    .filter-button:focus-visible,
    .delete-button:focus-visible,
    .todo-check:focus-visible {
      outline: 3px solid rgba(229, 107, 78, 0.35);
      outline-offset: 2px;
    }

    .filter-bar {
      display: flex;
      gap: 8px;
      margin: -12px 0 26px;
    }

    .filter-button {
      padding: 7px 12px;
      color: var(--muted);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;
      font-size: 0.82rem;
    }

    .filter-button:hover,
    .filter-button.active {
      color: var(--accent-dark);
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      border-color: color-mix(in srgb, var(--accent) 30%, transparent);
    }

    .list-heading {
      gap: 12px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .list-rule {
      height: 1px;
      flex: 1;
      background: var(--line);
    }

    .todo-list {
      display: grid;
      gap: 10px;
      margin: 16px 0 0;
      padding: 0;
      list-style: none;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 12px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      animation: item-in 240ms ease both;
    }

    .todo-check {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
      margin: 0;
      accent-color: var(--success);
      cursor: pointer;
    }

    .todo-text {
      min-width: 0;
      flex: 1;
      overflow-wrap: anywhere;
      line-height: 1.45;
    }

    .todo-item.completed .todo-text {
      color: var(--muted);
      text-decoration: line-through;
      text-decoration-thickness: 2px;
    }

    .delete-button {
      padding: 5px 7px;
      color: var(--muted);
      font-size: 1.2rem;
      line-height: 1;
      background: transparent;
      border-radius: 8px;
    }

    .delete-button:hover {
      color: var(--accent-dark);
      background: color-mix(in srgb, var(--accent) 12%, transparent);
    }

    .empty-state {
      margin: 28px 0;
      color: var(--muted);
      font-size: 0.95rem;
      text-align: center;
    }

    .empty-state[hidden] {
      display: none;
    }

    .app-footer {
      margin-top: 28px;
      padding-top: 18px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      font-size: 0.85rem;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes card-in {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes item-in {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .app-shell {
        padding: 20px 12px;
      }

      .todo-card {
        padding: 24px 18px;
        border-radius: 18px;
      }

      .todo-form button {
        padding: 0 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <section class="todo-card" aria-labelledby="page-title">
      <header class="app-header">
        <div>
          <p class="eyebrow">MY DAY / TASKS</p>
          <h1 id="page-title">今日待辦</h1>
        </div>
        <div class="header-actions">
          <button class="theme-toggle" id="theme-toggle" type="button"></button>
          <div class="header-mark" aria-hidden="true">✓</div>
        </div>
      </header>

      <form class="todo-form" id="todo-form">
        <label class="sr-only" for="todo-input">新增待辦事項</label>
        <input
          id="todo-input"
          name="todo"
          type="text"
          placeholder="接下來要完成什麼？"
          autocomplete="off"
          maxlength="120"
        >
        <button type="submit">新增</button>
      </form>

      <div class="filter-bar" aria-label="篩選待辦事項">
        <button class="filter-button active" type="button" data-filter="all" aria-pressed="true">全部</button>
        <button class="filter-button" type="button" data-filter="active" aria-pressed="false">未完成</button>
        <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">已完成</button>
      </div>

      <div class="list-heading">
        <span>任務清單</span>
        <span class="list-rule" aria-hidden="true"></span>
      </div>

      <ul class="todo-list" id="todo-list" aria-live="polite"></ul>
      <p class="empty-state" id="empty-state"></p>

      <footer class="app-footer">
        <span id="remaining-count">未完成:0 項</span>
        <button
          id="clear-completed"
          class="clear-completed"
          type="button"
          aria-label="清除已完成項目"
          hidden
        >
          清除已完成
        </button>
      </footer>
    </section>
  </main>

  <script>
    const todoForm = document.querySelector("#todo-form");
    const todoInput = document.querySelector("#todo-input");
    const todoList = document.querySelector("#todo-list");
    const emptyState = document.querySelector("#empty-state");
    const remainingCount = document.querySelector("#remaining-count");
    const themeToggle = document.querySelector("#theme-toggle");
    const filterButtons = document.querySelectorAll("[data-filter]");
    const TODO_STORAGE_KEY = "today-todos";
    const THEME_STORAGE_KEY = "todo-theme";

    let todos = loadTodos();
    let currentFilter = "all";

    // 從瀏覽器儲存空間載入待辦事項,讀不到時使用空清單。
    function loadTodos() {
      try {
        const savedTodos = JSON.parse(localStorage.getItem(TODO_STORAGE_KEY));
        return Array.isArray(savedTodos) ? savedTodos : [];
      } catch {
        return [];
      }
    }

    // 保存待辦事項,讓重新整理後仍能顯示原有項目。
    function saveTodos() {
      localStorage.setItem(TODO_STORAGE_KEY, JSON.stringify(todos));
    }

    // 優先套用使用者保存的主題,沒有保存值時交給作業系統設定。
    function loadTheme() {
      const savedTheme = localStorage.getItem(THEME_STORAGE_KEY);

      if (savedTheme === "light" || savedTheme === "dark") {
        document.documentElement.dataset.theme = savedTheme;
      }
    }

    // 根據目前主題更新切換按鈕文字。
    function updateThemeToggle() {
      const isDark = document.documentElement.dataset.theme === "dark"
        || (!document.documentElement.dataset.theme
          && window.matchMedia("(prefers-color-scheme: dark)").matches);
      themeToggle.textContent = isDark ? "☀️ 淺色模式" : "🌙 深色模式";
      themeToggle.setAttribute("aria-label", isDark ? "切換為淺色模式" : "切換為深色模式");
    }

    function toggleTheme() {
      const isDark = document.documentElement.dataset.theme === "dark"
        || (!document.documentElement.dataset.theme
          && window.matchMedia("(prefers-color-scheme: dark)").matches);
      const nextTheme = isDark ? "light" : "dark";
      document.documentElement.dataset.theme = nextTheme;
      localStorage.setItem(THEME_STORAGE_KEY, nextTheme);
      updateThemeToggle();
    }

    // 根據目前篩選條件重新繪製清單與未完成數量。
    function renderTodos() {
      todoList.replaceChildren();

      const visibleTodos = todos.filter((todo) => (
        currentFilter === "all"
          || (currentFilter === "active" && !todo.completed)
          || (currentFilter === "completed" && todo.completed)
      ));

      visibleTodos.forEach((todo) => {
        const item = document.createElement("li");
        item.className = "todo-item";
        item.classList.toggle("completed", todo.completed);

        const checkbox = document.createElement("input");
        checkbox.className = "todo-check";
        checkbox.type = "checkbox";
        checkbox.checked = todo.completed;
        checkbox.setAttribute("aria-label", `標記「${todo.text}」為${todo.completed ? "未完成" : "已完成"}`);
        checkbox.addEventListener("change", () => toggleTodo(todo.id));

        const text = document.createElement("span");
        text.className = "todo-text";
        text.textContent = todo.text;

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-button";
        deleteButton.type = "button";
        deleteButton.setAttribute("aria-label", `刪除「${todo.text}」`);
        deleteButton.textContent = "×";
        deleteButton.addEventListener("click", () => deleteTodo(todo.id));

        item.append(checkbox, text, deleteButton);
        todoList.append(item);
      });

      const unfinishedCount = todos.filter((todo) => !todo.completed).length;
      remainingCount.textContent = `未完成:${unfinishedCount} 項`;
      emptyState.textContent = todos.length === 0
        ? "還沒有任何待辦事項,新增一個吧!"
        : currentFilter === "active"
          ? "目前沒有未完成的待辦事項。"
          : currentFilter === "completed"
            ? "目前沒有已完成的待辦事項。"
            : "目前沒有符合條件的待辦事項。";
      emptyState.hidden = visibleTodos.length > 0;
    }

    function addTodo(text) {
      todos.push({
        id: crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`,
        text,
        completed: false,
      });
      saveTodos();
      renderTodos();
    }

    function toggleTodo(id) {
      todos = todos.map((todo) => (
        todo.id === id ? { ...todo, completed: !todo.completed } : todo
      ));
      saveTodos();
      renderTodos();
    }

    function deleteTodo(id) {
      todos = todos.filter((todo) => todo.id !== id);
      saveTodos();
      renderTodos();
    }

    todoForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = todoInput.value.trim();

      if (!text) {
        todoInput.focus();
        return;
      }

      addTodo(text);
      todoInput.value = "";
      todoInput.focus();
    });

    themeToggle.addEventListener("click", toggleTheme);
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
      if (!document.documentElement.dataset.theme) {
        updateThemeToggle();
      }
    });

    filterButtons.forEach((button) => {
      button.addEventListener("click", () => {
        currentFilter = button.dataset.filter;
        filterButtons.forEach((filterButton) => {
          const isActive = filterButton === button;
          filterButton.classList.toggle("active", isActive);
          filterButton.setAttribute("aria-pressed", String(isActive));
        });
        renderTodos();
      });
    });

    loadTheme();
    updateThemeToggle();
    renderTodos();
  </script>
</body>
</html>
